
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Voice Agent</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 30px;
      background: #101827;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    .panel {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      margin-top: 20px;
    }

    button, input {
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      margin: 5px;
      font-size: 14px;
    }

    button {
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    input {
      background: #334155;
      color: white;
      border: 1px solid #475569;
    }

    #transcript {
      min-height: 180px;
      max-height: 350px;
      overflow-y: auto;
      background: #0f172a;
      padding: 15px;
      border-radius: 10px;
      white-space: pre-wrap;
    }

    .user { color: #93c5fd; }
    .agent { color: #86efac; }
    .status { color: #fbbf24; }
  </style>
</head>

<body>
  <div class="container">
    <h1>CRM AI Voice Agent</h1>
    <p>Local Tamil + English voice assistant</p>

    <div class="panel">
      <h3>Call Simulation</h3>

      <input
        id="customerName"
        placeholder="Customer name"
        value="Arun"
      />

      <button onclick="startCall('inbound')">
        Simulate Inbound Call
      </button>

      <button onclick="startCall('outbound')">
        Simulate Outbound Call
      </button>

      <p id="status" class="status">Call not started</p>
    </div>

    <div class="panel">
      <h3>Voice Conversation</h3>

      <button id="recordBtn" onclick="toggleRecording()">
        Start Recording
      </button>

      <button onclick="endCall()">
        End Call
      </button>

      <div style="margin-top:20px">
        <input
          id="message"
          style="width:70%"
          placeholder="Or type a message..."
        />

        <button onclick="sendText()">Send</button>
      </div>

      <h3>Conversation</h3>
      <div id="transcript"></div>

      <audio id="audioPlayer" controls style="width:100%; margin-top:15px"></audio>
    </div>
  </div>

  <script>
    let mode = "inbound";
    let sessionId = null;
    let recorder = null;
    let chunks = [];
    let isRecording = false;

    const statusElement = document.getElementById("status");
    const transcript = document.getElementById("transcript");
    const recordBtn = document.getElementById("recordBtn");

    function startCall(callMode) {
      mode = callMode;
      sessionId = crypto.randomUUID();

      transcript.innerHTML = "";

      const customer = document.getElementById("customerName").value;

      statusElement.textContent =
        `${mode.toUpperCase()} demo call connected with ${customer}`;

      if (mode === "outbound") {
        addMessage(
          "System",
          `Simulated outbound call to ${customer}.`
        );
      } else {
        addMessage(
          "System",
          "Simulated inbound call received."
        );
      }
    }

    function addMessage(sender, message) {
      const element = document.createElement("p");

      const senderElement = document.createElement("strong");
      senderElement.textContent = `${sender}: `;

      element.className =
        sender === "You" ? "user" :
        sender === "AI Agent" ? "agent" : "";

      element.appendChild(senderElement);
      element.appendChild(document.createTextNode(message));

      transcript.appendChild(element);
      transcript.scrollTop = transcript.scrollHeight;
    }

    async function toggleRecording() {
      if (!sessionId) {
        alert("Start an inbound or outbound demo call first.");
        return;
      }

      if (isRecording) {
        recorder.stop();
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: true
        });

        chunks = [];

        const mimeType = MediaRecorder.isTypeSupported("audio/webm")
          ? "audio/webm"
          : "";

        recorder = new MediaRecorder(
          stream,
          mimeType ? { mimeType } : {}
        );

        recorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            chunks.push(event.data);
          }
        };

        recorder.onstop = async () => {
          const blob = new Blob(chunks, {
            type: recorder.mimeType || "audio/webm"
          });

          stream.getTracks().forEach(track => track.stop());

          await sendAudio(blob);
        };

        recorder.start();

        isRecording = true;
        recordBtn.textContent = "Stop Recording";
        statusElement.textContent = "Listening... Speak now.";

      } catch (error) {
        alert("Microphone error: " + error.message);
      }
    }

    async function sendAudio(blob) {
      isRecording = false;
      recordBtn.textContent = "Start Recording";
      statusElement.textContent = "Transcribing and generating response...";

      const form = new FormData();

      form.append("audio", blob, "recording.webm");
      form.append("sessionId", sessionId);
      form.append("mode", mode);
      form.append(
        "customerName",
        document.getElementById("customerName").value
      );

      await processRequest(form);
    }

    async function sendText() {
      if (!sessionId) {
        alert("Start a demo call first.");
        return;
      }

      const message = document.getElementById("message").value.trim();

      if (!message) return;

      addMessage("You", message);

      const form = new FormData();

      form.append("text", message);
      form.append("sessionId", sessionId);
      form.append("mode", mode);
      form.append(
        "customerName",
        document.getElementById("customerName").value
      );

      document.getElementById("message").value = "";

      await processRequest(form);
    }

    async function processRequest(form) {
      try {
        statusElement.textContent = "AI is processing...";

        const response = await fetch("/api/voice/turn", {
          method: "POST",
          body: form
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.details || data.error);
        }

        if (data.userText) {
          addMessage("You", data.userText);
        }

        addMessage("AI Agent", data.reply);

        const audio = document.getElementById("audioPlayer");
        audio.src = data.audioUrl;
        await audio.play().catch(() => {});

        statusElement.textContent = "Call connected";

      } catch (error) {
        console.error(error);
        statusElement.textContent = "Error: " + error.message;
      }
    }

    async function endCall() {
      if (!sessionId) return;

      if (recorder && recorder.state === "recording") {
        recorder.stop();
      }

      await fetch("/api/voice/end", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId })
      });

      sessionId = null;
      statusElement.textContent = "Call ended";
      recordBtn.textContent = "Start Recording";
      isRecording = false;
    }
  </script>
</body>
</html>
